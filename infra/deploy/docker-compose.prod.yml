name: hmt

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-api: &api
  restart: unless-stopped
  logging: *logging
  env_file: ${HMT_ENV_FILE:?set HMT_ENV_FILE to the absolute path of the env file}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    neo4j:
      condition: service_healthy

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://hmt:${POSTGRES_PASSWORD}@postgres:5432/hmt
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  ENABLE_REDIS: "true"
  NEO4J_URI: bolt://neo4j:7687
  ENABLE_NEO4J: "true"
  PARTICIPANT_API_URL: http://participant-api:3000/api/v1
  ORGANIZER_API_URL: http://organizer-api:3002/api/v1

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: hmt
      POSTGRES_USER: hmt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmt -d hmt"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    logging: *logging
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  participant-api:
    <<: *api
    build:
      context: ../..
      dockerfile: apps/participant-api/Dockerfile
    environment:
      <<: *api-env
      PORT: "3000"

  organizer-api:
    <<: *api
    build:
      context: ../..
      dockerfile: apps/organizer-api/Dockerfile
    environment:
      <<: *api-env
      ORGANIZER_API_PORT: "3002"

  caddy:
    build:
      context: ../..
      dockerfile: infra/deploy/caddy.Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - participant-api
      - organizer-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pg_data:
  redis_data:
  neo4j_data:
  caddy_data:
  caddy_config:
