version: '3.8'

services:
  participant-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://hmt_user:hmt_password@postgres:5432/hmt_participant_db?schema=public
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=hmt_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=super-secret-hmt-jwt-access-key-production-ready-32-chars-minimum
      - JWT_REFRESH_SECRET=super-secret-hmt-jwt-refresh-key-production-ready-32-chars-minimum
      - AI_API_KEY=${AI_API_KEY}
    depends_on:
      - postgres
      - neo4j
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: hmt_postgres
    environment:
      POSTGRES_USER: hmt_user
      POSTGRES_PASSWORD: hmt_password
      POSTGRES_DB: hmt_participant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmt_user -d hmt_participant_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: hmt_neo4j
    environment:
      NEO4J_AUTH: neo4j/hmt_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p hmt_password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hmt_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
